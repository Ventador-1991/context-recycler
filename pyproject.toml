[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-recycler"
version = "1.0.0"
description = "Zero-cost local LLM filter, AST tree-shaker, and SHA-256 chunk cache for AI coding agents."
readme = "README.md"
authors = [
    { name = "Salvatore Lombardo", email = "salvatorelombardosr@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "tiktoken>=0.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
context-recycler = "context_recycler.cli:main"

[project.urls]
Homepage = "https://github.com/salvatorelombardosr-sudo/context-recycler"
Repository = "https://github.com/salvatorelombardosr-sudo/context-recycler"
Issues = "https://github.com/salvatorelombardosr-sudo/context-recycler/issues"
